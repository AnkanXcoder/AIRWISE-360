how
Production website-এ AIRWISE 360° title এবং logo (favicon) পরিবর্তন করতে GitHub-এ push করতে হবে এবং Netlify deployment সম্পন্ন হতে হবে।

তোমার project-এর জন্য পুরো process:

Local code update

frontend/index.html এবং frontend/public/favicon.svg update করব।

Local testing

localhost:5173-এ title ও favicon verify করব।

Git commit and push

GitHub-এর main branch-এ শুধু প্রয়োজনীয় পরিবর্তন push করব।

Netlify deployment

Netlify GitHub থেকে নতুন code নিয়ে production build করবে।

Production verification

https://airwise-360.netlify.app খুলে verify করব।

Step 1: আগে local changes complete করো
তোমার frontend/public/favicon.svg ফাইলটি update করে save করো। index.html-এর title ইতিমধ্যেই ঠিক আছে।

তারপর আমাকে শুধু DONE বলো।

আমি তোমাকে পরের ধাপে exact CMD commands দেব:

git status
git add frontend/index.html frontend/public/favicon.svg
git commit -m "Update AIRWISE branding"
git push origin main
এখনই এই commands run কোরো না। আগে local changes ও testing শেষ করি। Git push করার পর Netlify deployment verify করব।

complete push
ঠিক আছে। এবার AIRWISE 360°-এর branding changes GitHub-এ push করে Netlify production-এ deploy করব।

তোমার existing working project নিরাপদ রাখতে শুধু এই দুটি ফাইল push করব:

frontend/index.html

frontend/public/favicon.svg

Step 1: Git status check
Windows CMD খুলে এই commands চালাও:

cd /d "C:\Users\ANKAN SEN\Desktop\AIRWISE_360_FINAL_PATCH"
git status --short
Output আমাকে পাঠাও।

আমি আগে verify করব যে শুধু branding-এর পরিবর্তন আছে কি না। তারপর তোমাকে exact staging, commit এবং push commands দেব। অন্য কোনো project file accidentally push করব না।

(.venv) C:\Users\ANKAN SEN\Desktop\airwise zip\AIRWISE_360_FINAL_PATCH>git status --short
?? audit_registry_integrity.py
?? backend/database_sqlite_backup.py
?? backend/migrate_registry_to_neon.py
?? backend/services/india_registry_service_sqlite_backup.py
?? historical_ingestion_audit.txt
?? india_registry_audit.txt
?? package-lock.json
?? save_historical_data_audit.txt

(.venv) C:\Users\ANKAN SEN\Desktop\airwise zip\AIRWISE_360_FINAL_PATCH>
তোমার Git status অনুযায়ী ৮টি untracked file আছে। এগুলো আমাদের branding update-এর অংশ নয়। এগুলো push করব না।

আর একটি বিষয়: git status-এ modified file দেখা যাচ্ছে না। অর্থাৎ এই working directory-তে index.html এবং favicon.svg-এর পরিবর্তন Git detect করছে না, অথবা পরিবর্তনগুলো এখনও করা হয়নি।

Step 2: দুটি ফাইল verify করো
CMD-তে চালাও:

git diff -- frontend/index.html frontend/public/favicon.svg
তারপর:

git log -1 --oneline
দুটোর output পাঠাও।

এখনই git add . বা git push কোরো না। আগে নিশ্চিত হব যে সঠিক branding changes commit হচ্ছে, অন্য কোনো file নয়।

