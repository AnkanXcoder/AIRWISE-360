services:
  - type: web
    name: airwise-360-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: OPENAQ_API_KEY
        sync: false
      - key: AIRWISE_CORS_ORIGINS
        sync: false
